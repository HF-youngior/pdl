# SonarQube项目配置文件
# PDL企业管理系统静态安全测试
sonar.projectKey=pdl
# 项目基本信息 - 统一配置
#sonar.projectKey=PDL-Enterprise-Management
sonar.projectName=PDL企业管理系统
sonar.projectVersion=1.0.0

# 扫描源代码路径
sonar.sources=backend,lib
sonar.inclusions=**/*.js,**/*.dart,**/*.html

# 排除不需要扫描的文件和目录
sonar.exclusions=**/node_modules/**,**/build/**,**/dist/**,**/public/uploads/**,**/*.min.js,**/coverage/**,**/*.test.js,**/*.spec.js

# 排除测试文件
sonar.test.exclusions=**/test/**,**/tests/**,**/*test*/**,**/*spec*/

# JavaScript/Node.js配置
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.clean.info
sonar.javascript.file.suffixes=.js

# Dart/Flutter配置
sonar.dart.file.suffixes=.dart

# 编码设置
sonar.sourceEncoding=UTF-8

# 质量门禁设置
sonar.qualitygate.wait=false

# 安全扫描配置
sonar.security.hotspots.enabled=true
sonar.security.vulnerabilities.enabled=true

# 代码覆盖率
sonar.coverage.exclusions=**/migrations/**,**/seeders/**,**/config/**

# 代码复杂度阈值
sonar.complexity.file.threshold=20
sonar.complexity.function.threshold=10

# 重复代码检测
sonar.cpd.exclusions=**/generated/**,**/auto-generated/**

# 扫描超时设置（分钟）
sonar.scanner.timeout=10

# SonarQube服务器配置
sonar.host.url=http://localhost:9000
