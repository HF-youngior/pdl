# SonarQube项目配置文件
# PDL企业管理系统静态安全测试
sonar.projectKey=pdl_enterprise_backend
# 项目基本信息 - 统一配置
#sonar.projectKey=PDL-Enterprise-Management
sonar.projectName=PDL企业管理系统
sonar.projectVersion=1.0.0

# 扫描源代码路径 - 包含所有目录
sonar.sources=backend,lib,web,android,ios,linux,macos,windows
sonar.inclusions=**/*.js,**/*.dart,**/*.html,**/*.java,**/*.kt,**/*.swift,**/*.cpp,**/*.h

# 排除不需要扫描的文件和目录
sonar.exclusions=**/node_modules/**,**/build/**,**/dist/**,**/public/uploads/**,**/*.min.js,**/coverage/**,**/*.test.js,**/*.spec.js,**/generated/**,**/auto-generated/**

# 排除测试文件
sonar.test.exclusions=**/test/**,**/tests/**,**/*test*/**,**/*spec*/

# JavaScript/Node.js配置
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info
sonar.javascript.file.suffixes=.js

# Dart/Flutter配置
sonar.dart.file.suffixes=.dart

# 编码设置
sonar.sourceEncoding=UTF-8

# 质量门禁设置
sonar.qualitygate.wait=false

# 安全扫描配置 - OWASP Top 10 和 CWE Top 25
sonar.security.hotspots.enabled=true
sonar.security.vulnerabilities.enabled=true

# 启用OWASP Top 10规则集
sonar.java.rule.squid:S2078=activate # 硬编码凭证
sonar.java.rule.squid:S2068=activate # 硬编码密码
sonar.javascript.rule.squid:S2068=activate # JavaScript硬编码密码
sonar.javascript.rule.squid:S5122=activate # JavaScript硬编码凭证
sonar.dart.rule.squid:S2068=activate # Dart硬编码密码

# 启用CWE Top 25规则集
sonar.java.rule.squid:S112=activate # 未处理异常
sonar.java.rule.squid:S4792=activate # 配置安全
sonar.javascript.rule.squid:S112=activate # JavaScript未处理异常
sonar.javascript.rule.squid:S4792=activate # JavaScript配置安全
sonar.dart.rule.squid:S112=activate # Dart未处理异常

# 自定义规则 - 硬编码密钥检测
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=.*hardcoded.*
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.js,**/*.dart,**/*.html

# 自定义规则 - 密码存储检查
sonar.issue.ignore.multicriteria=e2
sonar.issue.ignore.multicriteria.e2.ruleKey=.*password.*
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*.js,**/*.dart,**/*.html

# 代码覆盖率
sonar.coverage.exclusions=**/migrations/**,**/seeders/**,**/config/**,**/test/**,**/tests/**

# 代码复杂度阈值
sonar.complexity.file.threshold=20
sonar.complexity.function.threshold=10

# 重复代码检测
sonar.cpd.exclusions=**/generated/**,**/auto-generated/**

# 扫描超时设置（分钟）
sonar.scanner.timeout=10

# SonarQube服务器配置
sonar.host.url=http://localhost:9000
