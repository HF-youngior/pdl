# SonarQube项目配置
sonar.projectKey=pdl_enterprise_backend
sonar.projectName=PDL Enterprise Full Project
sonar.projectVersion=1.0.0

# 源代码路径 - 扫描整个项目的主要目录
#sonar.sources=../backend,../lib,../android,../ios,../web,../web_admin,../windows,../linux,../macos,../flutter_input.txt,../pubspec.yaml,../package.json
sonar.sources=..
# 包含的文件类型
sonar.inclusions=**/*.js,**/*.ts,**/*.dart,**/*.java,**/*.kt,**/*.html,**/*.css,**/*.scss,**/*.json,**/*.yaml,**/*.yml,**/*.md,**/*.txt

# 测试路径
sonar.tests=../test,../backend/test

# 测试文件包含
sonar.test.inclusions=**/*.test.js,**/*.test.ts,**/*.spec.js,**/*.spec.ts,**/*.test.dart

# 排除目录 - 排除构建产物和依赖
sonar.exclusions=**/node_modules/**,**/build/**,**/dist/**,**/coverage/**,**/.git/**,**/.scannerwork/**,**/android/app/build/**,**/ios/build/**,**/linux/build/**,**/macos/build/**,**/windows/build/**,**/web/build/**,**/*.lock,**/*.log,**/android/.gradle/**,**/ios/Pods/**

# 覆盖率报告路径 - 支持多语言
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# 覆盖率排除 - 排除生成的覆盖率脚本本身
sonar.coverage.exclusions=**/*coverage*.js,**/coverage/**

# 编码
sonar.sourceEncoding=UTF-8

# 多语言支持
sonar.javascript.file.suffixes=.js
sonar.typescript.file.suffixes=.ts
sonar.dart.file.suffixes=.dart
sonar.java.file.suffixes=.java
sonar.kotlin.file.suffixes=.kt